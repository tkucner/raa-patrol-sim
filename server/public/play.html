<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrol Unit Simulator</title>
<style>
:root{--plum:#45004D;--mag:#B1059D;--peach:#FFDBC4;--amber:#D99216;--light:#F6ECF5;--ink:#1A1A1A;--muted:#666;--ok:#1B6E20;--bad:#B3261E;--line:#ddd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:15px/1.4 Arial,Helvetica,sans-serif}
body.big{font-size:19px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:var(--plum);color:#fff}
header h1{font-size:1.1em;margin:0 10px 0 0;white-space:nowrap}
.phase{padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.12);font-size:.9em}
.phase.on{background:var(--mag);font-weight:bold}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--plum);background:#fff;color:var(--plum);padding:6px 12px;min-height:38px;touch-action:manipulation}
button.primary{background:var(--mag);border-color:var(--mag);color:#fff;font-weight:bold}
button.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
main{display:flex;gap:12px;padding:12px;align-items:flex-start}
#mapWrap{flex:1 1 auto;min-width:0}
#map{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block;touch-action:none}
#side{flex:0 0 460px;max-width:460px}
body.big #side{flex-basis:540px;max-width:540px}
.card{background:var(--light);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;color:var(--plum);font-size:1.05em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:5px 10px;border-radius:6px;border:1px solid var(--plum);background:#fff;color:var(--plum);min-height:34px}
.tab.on{background:var(--plum);color:#fff}
label.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
select,textarea,input{font:inherit;padding:4px 6px;border:1px solid #bbb;border-radius:4px;background:#fff}
textarea{width:100%;min-height:90px}
.bar{height:10px;background:#e6e6e6;border-radius:5px;overflow:hidden;margin:3px 0 6px}
.bar>i{display:block;height:100%;background:var(--mag)}
.bar.red>i{background:var(--bad)}
.warn{color:var(--bad);font-weight:bold}
.note{color:var(--muted);font-size:.9em}
.msg{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:90vw}
.msg.err{background:var(--bad)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;font-size:.92em}
th{background:var(--plum);color:#fff}
.rep{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:8px;border:2px solid transparent}
.rep.low{background:#FFF3EA}
.rep:hover{border-color:var(--mag)}
.rep .top{display:flex;justify-content:space-between;font-weight:bold;color:var(--plum)}
.btns{display:flex;gap:8px;margin-top:6px}
.btns button{flex:1;padding:10px;min-height:52px;font-size:1.05em;font-weight:bold}
.okb{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.nob{background:#fff!important;border-color:#777!important;color:#333!important}
.chkb{background:var(--amber)!important;border-color:var(--amber)!important;color:#fff!important}
#log{max-height:170px;overflow:auto;font-size:.9em;background:#fff;border-radius:6px;padding:6px}
#log div{border-bottom:1px dotted #ddd;padding:2px 0}
.clock{font-size:1.6em;font-weight:bold;color:var(--plum)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.kpi{background:#fff;border-radius:6px;padding:6px;text-align:center}
.kpi b{display:block;font-size:1.4em;color:var(--mag)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin:0 10px 4px 0;font-size:.88em}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #999}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.82em;padding:1px 7px;border-radius:9px;background:#eee}
.chip.good{background:#DDEFD9}.chip.bad{background:#F6D5D2}.chip.mid{background:#FFE8D6}
button.chip{min-height:30px;border:1px solid #bbb;color:#333;background:#fff;padding:2px 8px}
button.chip.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.verdict{display:inline-block;padding:2px 10px;border-radius:10px;font-weight:bold;color:#fff}
.verdict.real{background:var(--ok)}.verdict.false{background:#777}
.saw{font-style:italic}
.seg{display:inline-flex;border:1px solid var(--plum);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:52px}
.seg button.on{background:var(--plum);color:#fff}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--peach);font-size:.85em}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.dialog{background:#fff;border-radius:10px;padding:18px 22px;max-width:860px;width:92vw;max-height:88vh;overflow:auto}
.dialog h2{margin-top:0;color:var(--plum)}
#joinView{max-width:560px;margin:40px auto;padding:0 16px}
#joinView h1{color:var(--plum)}
#joinView label{display:block;margin:12px 0 4px;font-weight:bold}
#joinView input,#joinView select{width:100%;padding:10px;font-size:1.05em}
.big-code{font-size:2.4em;font-weight:bold;letter-spacing:.12em;color:var(--mag)}
.checks{margin:4px 0 0 18px;padding:0}.checks li{margin:2px 0}
.score td:last-child,.score th:last-child{text-align:right}
.total td{font-weight:bold;font-size:1.1em;border-top:2px solid var(--plum)}
@media (max-width:1100px){main{flex-direction:column}#side{max-width:none;flex-basis:auto;width:100%}}
</style>
</head>
<body>
<div id="joinView">
  <h1>Patrol Unit Simulator</h1>
  <p>Join your group's patrol unit. Your facilitator gives you the class code.</p>
  <label for="jCode">Class code</label><input id="jCode" autocomplete="off" placeholder="e.g. K7Q2M" style="text-transform:uppercase">
  <label for="jGroup">Group name</label><input id="jGroup" list="jGroups" autocomplete="off" placeholder="e.g. Group 3"><datalist id="jGroups"></datalist>
  <label for="jRole">Your role</label>
  <select id="jRole"><option value="">Choose…</option><option value="commander">Commander</option><option value="operator1">Operator 1</option><option value="operator2">Operator 2</option><option value="drone">Drone lead</option><option value="ground">Ground robot lead</option><option value="mast">Sensor mast lead</option></select>
  <p><button class="primary" id="btnJoin" style="width:100%;padding:12px">Join</button></p>
  <hr style="margin:28px 0">
  <p class="note">Facilitator only:</p>
  <p><button id="btnNewClass">Start a new class</button> <button id="btnFacRejoin" style="display:none">Return to my class</button></p>
</div>

<div id="appView" style="display:none">
  <header>
    <h1>Patrol Unit Simulator</h1>
    <span id="who"></span>
    <span id="phases" style="display:flex;gap:4px;flex-wrap:wrap"></span>
    <span id="roundInfo"></span>
    <div class="spacer"></div>
    <button class="ghost" id="btnBig">Large text</button>
    <button class="ghost" id="btnHelp">How it works</button>
    <button class="ghost" id="btnLeave">Leave</button>
  </header>
  <main>
    <div id="mapWrap"><canvas id="map" width="960" height="640" aria-label="Map"></canvas><div id="mapBar" style="margin-top:6px"></div></div>
    <div id="side"></div>
  </main>
</div>

<script src="core.js"></script>
<script src="views.js"></script>
<script>
(function () {
'use strict';
var C = window.SimCore, W = C.W, H = C.H, T = C.T, PX = 16, KINDS = ['drone', 'ground', 'mast'];
var ROLE_NAMES = { facilitator: 'Facilitator', commander: 'Commander', operator1: 'Operator 1', operator2: 'Operator 2', drone: 'Drone lead', ground: 'Ground robot lead', mast: 'Sensor mast lead' };
var PHASES = [['setup', 'Setup'], ['mission', 'Mission'], ['gap', 'Gap'], ['debrief', 'Debrief']];
var COL = { open: '#EFEAD8', build: '#6B5B6E', trees: '#7FA36B', ridge: '#C9A27A', road: '#B9B9B9', marsh: '#9CC3B9', water: '#5B8FD1' };
var ACOL = { drone: '#B1059D', ground: '#D99216', mast: '#45004D' };
var STORE = 'patrolsim.class.v1';
var ME = { code: '', group: '', role: '', token: '' };
var ST = null, FAC = null, UI = { tab: null, mapMode: 'briefing', hover: null, notes: {}, corrType: 'demolished', pvLook: 'person', pvWx: 'clear', editAt: 0, sideKey: '', watch: '', truth: false, big: false, recheckAsset: {} };
var NOTE_CHIPS = ['Two sensors agree', 'Fits the place', 'Odd place for it', 'Sensor weak now', 'Repeated report', 'Vague description'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function mmss(t) { t = Math.max(0, Math.floor(t || 0)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function msg(text, err) { var d = document.createElement('div'); d.className = 'msg' + (err ? ' err' : ''); d.textContent = text; document.body.appendChild(d); setTimeout(function () { d.remove(); }, err ? 4200 : 2600); }
function saveMe() { try { localStorage.setItem(STORE, JSON.stringify({ me: ME, big: UI.big, fac: JSON.parse(localStorage.getItem(STORE) || '{}').fac || {} })); } catch (e) { /* no storage */ } }
function loadMe() { try { var s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s) { if (s.me) ME = s.me; UI.big = !!s.big; return s; } } catch (e) { /* ignore */ } return {}; }
function rememberFac(code, token) { try { var s = JSON.parse(localStorage.getItem(STORE) || '{}'); s.fac = s.fac || {}; s.fac[code] = token; localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) { /* ignore */ } }
function facToken(code) { try { var s = JSON.parse(localStorage.getItem(STORE) || '{}'); return (s.fac || {})[code] || ''; } catch (e) { return ''; } }

function api(method, url, data) {
  var opt = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (data) opt.body = JSON.stringify(data);
  return fetch(url, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok) j.error = j.error || ('Error ' + r.status); return j; }); }, function () { return { error: 'Cannot reach the server. Check the connection.' }; });
}
function act(type, extra) {
  var d = Object.assign({ code: ME.code, group: ME.group, role: ME.role, token: ME.token, type: type }, extra || {});
  return api('POST', 'api/act', d).then(function (r) { if (r.error) msg(r.error, true); else pollNow(); return r; });
}

/* ================= join ================= */
function showJoin(err) {
  $('appView').style.display = 'none'; $('joinView').style.display = '';
  $('jCode').value = ME.code || ''; $('jGroup').value = ME.group || ''; $('jRole').value = ME.role && ME.role !== 'facilitator' ? ME.role : '';
  $('btnFacRejoin').style.display = ME.code && facToken(ME.code) ? '' : 'none';
  if (err) msg(err, true);
}
$('jCode').addEventListener('change', function () { var c = $('jCode').value.trim().toUpperCase(); if (!c) return; api('GET', 'api/groups?code=' + encodeURIComponent(c)).then(function (r) { if (r.groups) $('jGroups').innerHTML = r.groups.map(function (g) { return '<option value="' + esc(g) + '">'; }).join(''); }); });
$('btnJoin').addEventListener('click', function () {
  var code = $('jCode').value.trim().toUpperCase(), group = $('jGroup').value.trim(), role = $('jRole').value;
  if (!code || !group || !role) { msg('Enter the class code, your group name and your role.', true); return; }
  api('POST', 'api/join', { code: code, group: group, role: role }).then(function (r) {
    if (r.error) { msg(r.error, true); return; }
    ME = { code: code, group: r.group, role: role, token: '' }; saveMe(); enterApp();
  });
});
$('btnNewClass').addEventListener('click', function () {
  api('POST', 'api/class', {}).then(function (r) { if (r.error) { msg(r.error, true); return; } ME = { code: r.code, group: '', role: 'facilitator', token: r.token }; rememberFac(r.code, r.token); saveMe(); enterApp(); });
});
$('btnFacRejoin').addEventListener('click', function () { ME = { code: ME.code, group: '', role: 'facilitator', token: facToken(ME.code) }; saveMe(); enterApp(); });
$('btnLeave').addEventListener('click', function () { stopPoll(); ST = FAC = null; UI.sideKey = ''; showJoin(); });
$('btnBig').addEventListener('click', function () { UI.big = !UI.big; document.body.classList.toggle('big', UI.big); saveMe(); });
$('btnHelp').addEventListener('click', showHelp);

function enterApp() { $('joinView').style.display = 'none'; $('appView').style.display = ''; document.body.classList.toggle('big', UI.big); UI.sideKey = ''; UI.tab = null; startPoll(); }

/* ================= polling ================= */
var pollTimer = null, polling = false;
function stopPoll() { clearTimeout(pollTimer); pollTimer = null; }
function startPoll() { stopPoll(); poll(); }
function pollNow() { clearTimeout(pollTimer); poll(); }
function poll() {
  if (polling) { pollTimer = setTimeout(poll, 200); return; }
  polling = true;
  var q = 'code=' + encodeURIComponent(ME.code) + '&role=' + ME.role;
  if (ME.role === 'facilitator') q += '&token=' + ME.token + (UI.watch ? '&watch=' + encodeURIComponent(UI.watch) + (UI.truth ? '&truth=1' : '') : '');
  else q += '&group=' + encodeURIComponent(ME.group) + (ST && (ST.phase === 'gap' || ST.phase === 'debrief') ? '&full=1' : '');
  api('GET', 'api/state?' + q).then(function (r) {
    polling = false;
    if (r.error) { if (/No class|Unknown group|Facilitator key/.test(r.error)) { stopPoll(); showJoin(r.error); return; } msg(r.error, true); }
    else { if (ME.role === 'facilitator') FAC = r; else ST = r; render(); }
    var mission = (ME.role === 'facilitator' ? FAC && FAC.phase : ST && ST.phase) === 'mission';
    pollTimer = setTimeout(poll, mission ? 700 : 1500);
  });
}

/* ================= helpers ================= */
function view() { return ME.role === 'facilitator' ? (FAC && FAC.watch) : ST; }
function canEdit(part) { return ME.role === 'facilitator' || ME.role === 'commander' || ME.role === part || (part === 'operator' && /^operator/.test(ME.role)); }
function locked() { var v = view(); return v && v.round === 1; }
function opt(list, val) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
var TERR = ['open ground', 'in the built-up area', 'in the trees', 'on the ridge', 'on the road', 'in the marsh', 'in water'];
function placeText(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y), v = C.WORLD.brief[C.idx(Math.min(W - 1, xi), Math.min(H - 1, yi))];
  if (v === T.OPEN) { for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) if (C.inb(xi + dx, yi + dy) && C.WORLD.brief[C.idx(xi + dx, yi + dy)] === T.BUILD) return 'next to buildings'; }
  return TERR[v];
}
function evidence(reps, r, wx) {
  var others = reps.filter(function (o) { return o.id !== r.id && Math.abs(o.tArr - r.tArr) <= 40 && Math.hypot(o.x - r.x, o.y - r.y) <= 3; });
  var diff = {}, same = 0;
  others.forEach(function (o) { if (o.asset === r.asset && o.sensor === r.sensor) same++; else diff[C.ASSETS[o.asset].name + ' ' + C.SENSORS[o.sensor].name.toLowerCase()] = 1; });
  var names = Object.keys(diff), w = r.wx || wx, rate = C.rating(C.WEATHER[w].m[r.sensor]);
  var h = names.length ? '<span class="chip good">Also seen by: ' + esc(names.join(', ')) + '</span>' : '<span class="chip">No other sensor nearby</span>';
  if (same) h += '<span class="chip">Repeated ' + (same + 1) + '× here</span>';
  return h + '<span class="chip ' + (rate === 'good' ? 'good' : rate === 'weak' ? 'mid' : 'bad') + '">' + esc(C.SENSORS[r.sensor].name) + ' in ' + esc(C.WEATHER[w].label.toLowerCase()) + ': ' + rate + '</span>';
}

/* ================= map ================= */
var cv = $('map'), ctx = cv.getContext('2d'), terrainCache = {};
function terrainImage(grid, key) {
  if (terrainCache[key]) return terrainCache[key];
  var c = document.createElement('canvas'); c.width = W * PX; c.height = H * PX; var g = c.getContext('2d');
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) { var v = grid[C.idx(x, y)]; g.fillStyle = v === T.BUILD ? COL.build : v === T.TREES ? COL.trees : v === T.RIDGE ? COL.ridge : v === T.ROAD ? COL.road : v === T.MARSH ? COL.marsh : v === T.WATER ? COL.water : COL.open; g.fillRect(x * PX, y * PX, PX, PX); }
  g.font = 'bold 13px Arial'; g.fillStyle = 'rgba(30,30,30,.75)';
  [['Built-up block', 37, 9.3], ['Tree line', 17.2, 7], ['Ridge', 46, 23.8], ['Marsh', 49, 34], ['Road', 6, 19.4], ['Farm', 3.6, 38.3]].forEach(function (l) { g.fillText(l[0], l[1] * PX, l[2] * PX); });
  terrainCache[key] = c; return c;
}
function drawGrid() {
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
  for (var x = 0; x <= W; x += 10) { ctx.beginPath(); ctx.moveTo(x * PX, 0); ctx.lineTo(x * PX, H * PX); ctx.stroke(); }
  for (var y = 0; y <= H; y += 10) { ctx.beginPath(); ctx.moveTo(0, y * PX); ctx.lineTo(W * PX, y * PX); ctx.stroke(); }
  ctx.font = 'bold 12px Arial'; ctx.fillStyle = 'rgba(0,0,0,.55)';
  for (var i = 0; i < 6; i++) for (var j = 0; j < 4; j++) ctx.fillText('ABCDEF'.charAt(i) + (j + 1), i * 10 * PX + 4, j * 10 * PX + 14);
  ctx.strokeStyle = 'rgba(69,0,77,.85)'; ctx.lineWidth = 3; ctx.setLineDash([10, 6]);
  ctx.beginPath(); ctx.moveTo(30 * PX, 0); ctx.lineTo(30 * PX, H * PX); ctx.moveTo(0, 20 * PX); ctx.lineTo(W * PX, 20 * PX); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = 'bold 20px Arial'; ctx.fillStyle = 'rgba(69,0,77,.85)';
  C.ZONES.forEach(function (z) { ctx.fillText(z.name, (z.x1 - 3.5) * PX, (z.y1 - 0.6) * PX); });
}
function dot(x, y, r, fill, stroke) { ctx.beginPath(); ctx.arc(x * PX, y * PX, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } }
function drawUnitMap(v) {
  ctx.fillStyle = '#9a9a9a'; ctx.fillRect(0, 0, W * PX, H * PX);
  var m = v && v.sim && v.sim.map; if (!m) return;
  for (var i = 0; i < m.length; i++) { var c = m.charCodeAt(i); if (c === 48) continue; ctx.fillStyle = c === 50 ? '#2b2b2b' : '#f4f4f4'; ctx.fillRect((i % W) * PX, Math.floor(i / W) * PX, PX, PX); }
}
function drawBase() { var b = C.BASE; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#45004D'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b[0] * PX, b[1] * PX, 13, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#45004D'; ctx.font = 'bold 14px Arial'; ctx.fillText('B', b[0] * PX - 5, b[1] * PX + 5); ctx.font = 'bold 11px Arial'; ctx.fillText('Base (recharge)', b[0] * PX - 44, b[1] * PX + 28); }
function drawPaths(cfg) {
  KINDS.forEach(function (k) {
    var a = cfg[k]; ctx.strokeStyle = ACOL[k]; ctx.fillStyle = ACOL[k]; ctx.lineWidth = k === UI.tab ? 4 : 2.5;
    if (k === 'mast') { if (a.pos) { ctx.fillRect(a.pos[0] * PX - 2, a.pos[1] * PX - 2, PX + 4, PX + 4); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.fillText('M', a.pos[0] * PX + 3, a.pos[1] * PX + 12); } return; }
    var p = a.path || []; if (!p.length) return;
    var pts = k === 'ground' ? C.groundRoute(C.WORLD.brief, p).cells : p.concat([p[0]]);
    ctx.beginPath(); pts.forEach(function (q, i) { var X = (q[0] + 0.5) * PX, Y = (q[1] + 0.5) * PX; if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }); ctx.stroke();
    p.forEach(function (q, i) { dot(q[0] + 0.5, q[1] + 0.5, 7, ACOL[k], '#fff'); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.fillText(String(i + 1), (q[0] + 0.5) * PX - 3, (q[1] + 0.5) * PX + 4); });
  });
}
function drawAssets(v) {
  if (!v || !v.sim) return;
  v.sim.assets.forEach(function (st) {
    var k = st.kind, x = st.x, y = st.y, gone = !st.alive || st.charging;
    ctx.save(); ctx.globalAlpha = gone ? 0.35 : 1;
    if (k === 'mast') { ctx.fillStyle = ACOL[k]; ctx.fillRect(x * PX - 9, y * PX - 9, 18, 18); }
    else if (k === 'drone') { ctx.beginPath(); ctx.moveTo(x * PX, y * PX - 11); ctx.lineTo(x * PX + 10, y * PX + 8); ctx.lineTo(x * PX - 10, y * PX + 8); ctx.closePath(); ctx.fillStyle = ACOL[k]; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    else dot(x, y, 9, ACOL[k], '#fff');

cv.addEventListener('pointerdown', function (e) {
  var k = editKind(); if (!k || k === 'mast') return;
  var c = cellFromEvent(e), p = ST.cfg[k].path || [];
  for (var i = p.length - 1; i >= 0; i--) if (Math.hypot(p[i][0] - c[0], p[i][1] - c[1]) <= 1.6) { drag = { k: k, i: i, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } e.preventDefault(); return; }
});
cv.addEventListener('pointermove', function (e) { if (!drag) return; var c = cellFromEvent(e), pt = placePoint(ST.cfg, drag.k, c[0], c[1], true), cur = ST.cfg[drag.k].path[drag.i]; if (pt && (pt[0] !== cur[0] || pt[1] !== cur[1])) { ST.cfg[drag.k].path[drag.i] = pt; drag.moved = true; ST.cfg[drag.k].route = 'custom'; UI.editAt = Date.now(); draw(); } });
cv.addEventListener('pointerup', function (e) {
  var c = cellFromEvent(e);
  if (drag) { var d = drag; drag = null; if (!d.moved) ST.cfg[d.k].path.splice(d.i, 1); ST.cfg[d.k].route = 'custom'; sendCfg(d.k, ST.cfg[d.k]); UI.sideKey = ''; render(); return; }
  if (ST && ST.phase === 'gap' && KINDS.indexOf(ME.role) >= 0) { if (C.inb(c[0], c[1])) act('corr', { x: c[0], y: c[1], kind: UI.corrType }); return; }
  var k = editKind(); if (!k) return;
  var cfg = clone(ST.cfg), pt = placePoint(cfg, k, c[0], c[1]); if (!pt) return;
  if (k === 'mast') cfg.mast.pos = pt; else cfg[k].path = (cfg[k].path || []).concat([pt]);
  cfg[k].route = 'custom'; ST.cfg = cfg; sendCfg(k, cfg[k]); UI.sideKey = ''; render();
});

function dialog(html) { var o = document.createElement('div'); o.className = 'overlay'; o.innerHTML = '<div class="dialog">' + html + '<div style="text-align:right;margin-top:12px"><button class="primary" data-close>Close</button></div></div>'; o.addEventListener('click', function (e) { if (e.target === o || e.target.hasAttribute('data-close')) o.remove(); }); document.body.appendChild(o); }
function showHelp() {
  dialog('<h2>How it works</h2><p>Assets can go anywhere on the map. Their limits are battery time (they fly or drive back to base to recharge), sensor range and flight height.</p><p>Each group is one hybrid patrol unit: a drone, a ground robot and a sensor mast (the machines), operators and a commander (the people). Every group plays the same world with the same events at the same times. The facilitator moves all groups through the phases together.</p>' +
    '<ol><li><b>Setup.</b> Asset leads choose sensors, motion and patrol route. Operators set up their stations. The commander allocates zones, sets the reporting rules and marks the unit ready.</li>' +
    '<li><b>Mission.</b> Reports arrive at the operators. They judge each one REAL or FALSE and send it to the commander, who confirms, dismisses or orders a re-check. Disruptions appear only in the mission log.</li>' +
    '<li><b>Gap.</b> Operators write one report for the commander, the commander writes one direction per asset, asset leads correct the briefing map.</li>' +
    '<li><b>Debrief.</b> The truth is revealed with the score.</li></ol><h3>Four checks before a report goes to command</h3>' + CHECKS +
    '<h3>Scoring</h3><p>+30 per real contact confirmed · −20 per false or misplaced contact confirmed · −4 per expired report · +1 per % of area kept under watch · up to +30 for a fast first confirmation · −1 per report lost to the comms budget.</p>');
}

/* ================= start ================= */
var params = new URLSearchParams(location.search), saved = loadMe();
if (params.get('code')) { ME.code = params.get('code').toUpperCase(); if (params.get('group')) ME.group = params.get('group'); if (params.get('role')) ME.role = params.get('role'); ME.token = ME.role === 'facilitator' ? (params.get('token') || facToken(ME.code)) : ''; if (params.get('token')) rememberFac(ME.code, params.get('token')); }
document.body.classList.toggle('big', UI.big);
if (ME.code && ME.role && (ME.role === 'facilitator' ? ME.token : ME.group)) {
  if (ME.role === 'facilitator') enterApp();
  else api('POST', 'api/join', { code: ME.code, group: ME.group, role: ME.role }).then(function (r) { if (r.error) showJoin(r.error); else { ME.group = r.group; saveMe(); enterApp(); } });
} else showJoin();
draw();
window.addEventListener('error', function (e) { document.body.setAttribute('data-errors', (document.body.getAttribute('data-errors') || '') + '|' + e.message); });
window.__state = function () { return { ME: ME, ST: ST, FAC: FAC, UI: UI }; };
void saved;
})();
</script>
