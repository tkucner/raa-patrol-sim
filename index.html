<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrol Unit Simulator</title>
<style>
:root{--plum:#45004D;--mag:#B1059D;--peach:#FFDBC4;--amber:#D99216;--pink:#D881CE;--light:#F6ECF5;--ink:#1A1A1A;--muted:#666;--ok:#1B6E20;--bad:#B3261E;--line:#ddd;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Arial,Helvetica,sans-serif}
body.big{font-size:19px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:var(--plum);color:#fff}
header h1{font-size:1.15em;margin:0 12px 0 0;white-space:nowrap}
header input{width:9em;padding:4px 6px;border-radius:4px;border:0;font:inherit}
.phases{display:flex;gap:4px;flex-wrap:wrap}
.phase{padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:.9em}
.phase.on{background:var(--mag);font-weight:bold}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--plum);background:#fff;color:var(--plum);padding:6px 12px}
button.primary{background:var(--mag);border-color:var(--mag);color:#fff;font-weight:bold}
button.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button{min-height:38px}
.seg{display:inline-flex;border:1px solid var(--plum);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:52px}
.seg button.on{background:var(--plum);color:#fff}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl .big{padding:10px 18px;font-size:1.05em}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.82em;padding:1px 7px;border-radius:9px;background:#eee}
.chip.good{background:#DDEFD9}.chip.bad{background:#F6D5D2}.chip.mid{background:#FFE8D6}
.saw{font-style:italic}
.checks{margin:4px 0 0 18px;padding:0}.checks li{margin:2px 0}
main{display:flex;gap:12px;padding:12px;align-items:flex-start}
#mapWrap{flex:1 1 auto;min-width:0}
#map{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block;touch-action:none}
#side{flex:0 0 440px;max-width:440px}
body.big #side{flex-basis:520px;max-width:520px}
.card{background:var(--light);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;color:var(--plum);font-size:1.05em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:5px 10px;border-radius:6px;border:1px solid var(--plum);background:#fff;color:var(--plum)}
.tab.on{background:var(--plum);color:#fff}
label.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
select,textarea,input[type=number]{font:inherit;padding:4px 6px;border:1px solid #bbb;border-radius:4px;background:#fff}
textarea{width:100%;min-height:90px}
.bar{height:10px;background:#e6e6e6;border-radius:5px;overflow:hidden;margin:3px 0 6px}
.bar>i{display:block;height:100%;background:var(--mag)}
.bar.red>i{background:var(--bad)}
.warn{color:var(--bad);font-weight:bold}
.note{color:var(--muted);font-size:.9em}
.msg{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:90vw}
.msg.err{background:var(--bad)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;font-size:.92em}
th{background:var(--plum);color:#fff}
.rep{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:8px;border:2px solid transparent}
.rep.low{background:#FFF3EA}
.rep:hover{border-color:var(--mag)}
.rep .top{display:flex;justify-content:space-between;font-weight:bold;color:var(--plum)}
.rep .btns{display:flex;gap:8px;margin-top:6px}
.rep .btns button{flex:1;padding:10px;min-height:52px;font-size:1.1em;font-weight:bold;touch-action:manipulation}
.confirm{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.reject{background:#fff!important;border-color:#777!important;color:#333!important}
#log{max-height:180px;overflow:auto;font-size:.9em;background:#fff;border-radius:6px;padding:6px}
#log div{border-bottom:1px dotted #ddd;padding:2px 0}
.clock{font-size:1.6em;font-weight:bold;color:var(--plum)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:#fff;border-radius:6px;padding:6px;text-align:center}
.kpi b{display:block;font-size:1.4em;color:var(--mag)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin:0 10px 4px 0;font-size:.88em}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #999}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.dialog{background:#fff;border-radius:10px;padding:18px 22px;max-width:760px;width:92vw;max-height:88vh;overflow:auto}
.dialog h2{margin-top:0;color:var(--plum)}
.score td:last-child,.score th:last-child{text-align:right}
.total td{font-weight:bold;font-size:1.1em;border-top:2px solid var(--plum)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--peach);font-size:.85em}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}#printArea table{font-size:11pt}}
@media (max-width:1100px){main{flex-direction:column}#side{max-width:none;flex-basis:auto;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Patrol Unit Simulator</h1>
  <span>Group <input id="groupName" aria-label="Group name"></span>
  <span id="roundLabel"></span>
  <div class="phases" id="phases"></div>
  <div class="spacer"></div>
  <button class="ghost" id="btnBig" title="Larger text for the projector">Large text</button>
  <button class="ghost" id="btnHelp">How it works</button>
  <button class="ghost" id="btnBoard">Leaderboard</button>
  <button class="ghost" id="btnFac">Facilitator</button>
</header>
<main>
  <div id="mapWrap">
    <canvas id="map" width="960" height="640" aria-label="Map"></canvas>
    <div id="mapBar" style="margin-top:6px"></div>
  </div>
  <div id="side"></div>
</main>
<div id="printArea"></div>

<script id="core">
/* Patrol Unit Simulator: simulation core (shared by server and browser) */
/* ================= SIMULATION CORE (no DOM) ================= */
(function (root) {
'use strict';
var W = 60, H = 40, CELL_M = 10;
var T = { OPEN: 0, BUILD: 1, TREES: 2, RIDGE: 3, ROAD: 4, MARSH: 5, WATER: 6 };
function idx(x, y) { return y * W + x; }
function inb(x, y) { return x >= 0 && y >= 0 && x < W && y < H; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngFor(seed, name) { return mulberry32(((seed >>> 0) ^ hashStr(name)) >>> 0); }
function gauss(r) { var u = 0; while (u === 0) u = r(); var v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function zoneOf(x, y) { return (x < 30 ? 0 : 1) + (y < 20 ? 0 : 2); }
var ZONES = [{ id: 0, name: 'Z1', x0: 0, y0: 0, x1: 29, y1: 19 }, { id: 1, name: 'Z2', x0: 30, y0: 0, x1: 59, y1: 19 },
             { id: 2, name: 'Z3', x0: 0, y0: 20, x1: 29, y1: 39 }, { id: 3, name: 'Z4', x0: 30, y0: 20, x1: 59, y1: 39 }];
function square(x, y) { return 'ABCDEF'.charAt(clamp(Math.floor(x / 10), 0, 5)) + (clamp(Math.floor(y / 10), 0, 3) + 1); }

function buildWorld() {
  var truth = new Uint8Array(W * H), brief = new Uint8Array(W * H);
  function fill(g, x0, y0, w, h, v) { for (var y = y0; y < y0 + h; y++) for (var x = x0; x < x0 + w; x++) if (inb(x, y)) g[idx(x, y)] = v; }
  [truth, brief].forEach(function (g) {
    fill(g, 18, 0, 4, 17, T.TREES);
    fill(g, 34, 22, 26, 3, T.RIDGE);
    fill(g, 44, 29, 15, 10, T.MARSH);
    fill(g, 0, 18, 60, 2, T.ROAD);
    fill(g, 29, 0, 2, 40, T.ROAD);
    [36, 42, 48].forEach(function (bx) { [4, 10].forEach(function (by) { fill(g, bx, by, bx === 48 ? 5 : 4, by === 4 ? 3 : 4, T.BUILD); }); });
    fill(g, 4, 34, 4, 3, T.BUILD);
  });
  fill(brief, 36, 14, 4, 3, T.BUILD);   // demolished in reality
  fill(truth, 10, 28, 4, 3, T.BUILD);   // unmapped structure
  fill(truth, 29, 30, 2, 4, T.WATER);   // flooded road
  var errors = [
    { type: 'demolished', label: 'Block shown on the map is demolished', x: 36, y: 14, w: 4, h: 3 },
    { type: 'unmapped', label: 'Structure missing from the map', x: 10, y: 28, w: 4, h: 3 },
    { type: 'flooded', label: 'Road shown as open is flooded', x: 29, y: 30, w: 2, h: 4 }];
  return { truth: truth, brief: brief, errors: errors };
}
var WORLD = buildWorld();

var CONTACTS = [
  { id: 'R1', real: true, kind: 'vehicle', label: 'Parked vehicle, engine on and off', path: [[44, 8]], speed: 0, engine: 'cycle' },
  { id: 'R2', real: true, kind: 'person', label: 'Two people walking by the tree line', path: [[16, 2], [16, 15]], speed: 0.25 },
  { id: 'R3', real: true, kind: 'vehicle', label: 'Vehicle driving on the road', path: [[3, 18], [27, 18]], speed: 0.5, engine: 'on' },
  { id: 'R4', real: true, kind: 'person', label: 'Person hidden behind the ridge', path: [[45, 26]], speed: 0 },
  { id: 'R5', real: true, kind: 'person', label: 'Person in the demolished block', path: [[37, 15]], speed: 0 },
  { id: 'R6', real: true, kind: 'vehicle', label: 'Vehicle by the unmapped structure', path: [[15, 31]], speed: 0, engine: 'off' },
  { id: 'F1', real: false, kind: 'heat', label: 'Hot roof vent (false)', path: [[50, 5]], speed: 0 },
  { id: 'F2', real: false, kind: 'animal', label: 'Animal in the marsh (false)', path: [[46, 31], [56, 36]], speed: 0.2 },
  { id: 'F3', real: false, kind: 'debris', label: 'Debris pile (false)', path: [[6, 8]], speed: 0 },
  { id: 'F4', real: false, kind: 'metal', label: 'Metal shed roof (false)', path: [[24, 27]], speed: 0 }];

var SENSORS = {
  camera:   { name: 'Daylight camera', cost: 2, range: 10, posErr: 1.0, spur: 0.010, map: true,  los: true,  vendor: 4.2 },
  thermal:  { name: 'Thermal imager',  cost: 3, range: 8,  posErr: 1.0, spur: 0.012, map: true,  los: true,  vendor: 4.0 },
  lidar:    { name: 'Lidar',           cost: 5, range: 7,  posErr: 0.5, spur: 0.006, map: true,  los: true,  vendor: 4.4 },
  radar:    { name: 'Radar',           cost: 4, range: 12, posErr: 3.0, spur: 0.015, map: true,  los: true,  vendor: 3.6 },
  acoustic: { name: 'Acoustic',        cost: 1, range: 10, posErr: 4.0, spur: 0.020, map: false, los: false, vendor: 3.1 } };
var DET = { camera: { person: 0.55, vehicle: 0.65 }, thermal: { person: 0.65, vehicle: 0.6 }, lidar: { person: 0.5, vehicle: 0.7 },
            radar: { person: 0.2, vehicle: 0.55 }, acoustic: { person: 0.2, vehicle: 0.5 } };
var CLUT = { heat:   { camera: 0.03, thermal: 0.6,  lidar: 0.03, radar: 0.03, acoustic: 0.02 },
             animal: { camera: 0.25, thermal: 0.5,  lidar: 0.2,  radar: 0.3,  acoustic: 0.5 },
             debris: { camera: 0.2,  thermal: 0.05, lidar: 0.35, radar: 0.4,  acoustic: 0.02 },
             metal:  { camera: 0.3,  thermal: 0.1,  lidar: 0.2,  radar: 0.6,  acoustic: 0.02 } };
var WEATHER = {
  clear: { label: 'Clear day', m: { camera: 1, thermal: 1, lidar: 1, radar: 1, acoustic: 1 } },
  night: { label: 'Night', m: { camera: 0.08, thermal: 1.1, lidar: 1, radar: 1, acoustic: 1.1 } },
  rain:  { label: 'Heavy rain', m: { camera: 0.6, thermal: 0.55, lidar: 0.35, radar: 0.9, acoustic: 0.25 } },
  dust:  { label: 'Dust or smoke', m: { camera: 0.12, thermal: 0.6, lidar: 0.12, radar: 1, acoustic: 1 } },
  heat:  { label: 'Midday heat', m: { camera: 1, thermal: 0.12, lidar: 1, radar: 1, acoustic: 0.9 } } };
var ASSETS = {
  drone:  { name: 'Drone', speeds: { slow: 1.0, normal: 1.6, fast: 2.4 } },
  ground: { name: 'Ground robot', speeds: { slow: 0.5, normal: 0.8, fast: 1.2 } },
  mast:   { name: 'Sensor mast', speeds: null } };
var DESC = {
  person:  { camera: 'person-sized shape', thermal: 'warm, person-sized', lidar: 'upright shape, about 1.8 m', radar: 'small echo', acoustic: 'footsteps or voices' },
  vehicle: { camera: 'vehicle-shaped object', thermal: 'warm, vehicle-sized', lidar: 'box shape, about 4 m', radar: 'large echo', acoustic: 'engine noise' },
  heat:    { camera: 'unclear shape on a roof', thermal: 'hot spot, not moving', lidar: 'small object on a roof', radar: 'weak echo', acoustic: 'humming' },
  animal:  { camera: 'small moving shape', thermal: 'warm, small, moving', lidar: 'low moving shape', radar: 'small slow echo', acoustic: 'rustling' },
  debris:  { camera: 'irregular heap', thermal: 'cool object', lidar: 'low irregular object', radar: 'echo, not moving', acoustic: 'unclear sound' },
  metal:   { camera: 'bright reflection', thermal: 'cool flat surface', lidar: 'flat surface', radar: 'strong echo, not moving', acoustic: 'unclear sound' } };
var VAGUE = ['unclear signal', 'brief contact, then gone', 'faint shape'];
function describe(c, s, moving, r) {
  var roll = r();
  if (c.real && roll < 0.2) return ['unclear shape', 'unclear'];
  var kind = (!c.real && roll < 0.2) ? 'person' : c.kind;
  var d = DESC[kind][s];
  if (s === 'radar') d = (moving ? 'moving ' : 'still ') + d;
  return [d, kind];
}
var SPEEDQ = { slow: 1.15, normal: 1.0, fast: 0.75 };
var REVISIT = { carry: 0, once: 8, three: 24, orbit: 45 };
var PAYLOAD = 6;
var BASE = [29.5, 19.5], BASE_CELL = [29, 19], RECHARGE = 45;

function rating(m) { return m >= 0.8 ? 'good' : m >= 0.3 ? 'weak' : 'blind'; }
function payloadOf(a) { var c = 0; if (a.primary) c += SENSORS[a.primary].cost; if (a.fallback) c += SENSORS[a.fallback].cost; return c; }
function droneEndurance(a) { return 330 - 25 * payloadOf(a) - (a.speed === 'fast' ? 60 : a.speed === 'slow' ? -30 : 0) - (a.alt === 'high' ? 20 : 0); }
function groundEndurance(a) { return 600 - 30 * payloadOf(a) - (a.speed === 'fast' ? 120 : a.speed === 'slow' ? -60 : 0); }

function contactPos(c, t) {
  if (!c.speed || c.path.length < 2) return { x: c.path[0][0] + 0.5, y: c.path[0][1] + 0.5, moving: false };
  var segs = [], L = 0;
  for (var i = 0; i < c.path.length - 1; i++) { var dx = c.path[i + 1][0] - c.path[i][0], dy = c.path[i + 1][1] - c.path[i][1], l = Math.hypot(dx, dy); segs.push(l); L += l; }
  var d = (t * c.speed) % (2 * L); if (d > L) d = 2 * L - d;
  for (var j = 0; j < segs.length; j++) { if (d <= segs[j] || j === segs.length - 1) { var f = segs[j] ? d / segs[j] : 0; return { x: c.path[j][0] + (c.path[j + 1][0] - c.path[j][0]) * f + 0.5, y: c.path[j][1] + (c.path[j + 1][1] - c.path[j][1]) * f + 0.5, moving: true }; } d -= segs[j]; }
  return { x: c.path[0][0] + 0.5, y: c.path[0][1] + 0.5, moving: true };

function engineOn(c, t) { return c.engine === 'on' || (c.engine === 'cycle' && Math.floor(t / 60) % 2 === 0); }

/* line of sight on the true map; returns factor 0..1 */
function losFactor(x0, y0, x1, y1, obs) {
  var cx0 = Math.floor(x0), cy0 = Math.floor(y0), cx1 = Math.floor(x1), cy1 = Math.floor(y1);
  var dx = Math.abs(cx1 - cx0), sx = cx0 < cx1 ? 1 : -1, dy = -Math.abs(cy1 - cy0), sy = cy0 < cy1 ? 1 : -1, err = dx + dy, x = cx0, y = cy0, f = 1;
  while (!(x === cx1 && y === cy1)) {
    var e2 = 2 * err; if (e2 >= dy) { err += dy; x += sx; } if (e2 <= dx) { err += dx; y += sy; }
    if (x === cx1 && y === cy1) break;
    var v = WORLD.truth[idx(x, y)];
    if (v === T.BUILD) { if (obs.high) continue; return 0; }
    if (v === T.RIDGE) { if (obs.air || obs.onRidge) continue; return 0; }
    if (v === T.TREES) { f *= obs.high ? 0.92 : obs.air ? 0.8 : obs.mast ? 0.85 : 0.7; if (f < 0.25) return 0; }
  }
  return f;
}
function soundFactor(x0, y0, x1, y1) {
  var n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0, f = 1;
  for (var i = 1; i < n; i++) { var x = Math.floor(x0 + (x1 - x0) * i / n), y = Math.floor(y0 + (y1 - y0) * i / n); if (WORLD.truth[idx(x, y)] === T.BUILD) f *= 0.85; }
  return Math.max(f, 0.3);

/* road routing on a given grid; returns array of [x,y] cells or null */
function bfsRoad(grid, a, b) {
  if (grid[idx(a[0], a[1])] !== T.ROAD || grid[idx(b[0], b[1])] !== T.ROAD) return null;
  var prev = new Int32Array(W * H).fill(-1), q = [idx(a[0], a[1])], seen = new Uint8Array(W * H), goal = idx(b[0], b[1]);

    var c = q[qi]; if (c === goal) break;
    var cx = c % W, cy = (c / W) | 0;

  }
  if (!seen[goal]) return null;
  var out = [], k = goal; while (k !== -1) { out.push([k % W, (k / W) | 0]); k = prev[k]; } return out.reverse();
}
function groundRoute(grid, wps) {
  if (!wps || wps.length < 2) return { cells: wps && wps.length ? [wps[0]] : [], blocked: false, loop: false };
  var cells = [], loopPts = wps.concat([wps[0]]), blocked = false, blockedAt = null;
  for (var i = 0; i < loopPts.length - 1; i++) {
    var seg = bfsRoad(grid, loopPts[i], loopPts[i + 1]);
    if (!seg) { blocked = true; blockedAt = loopPts[i + 1]; break; }
    if (cells.length) seg.shift(); cells = cells.concat(seg);
  }
  return { cells: cells, blocked: blocked, blockedAt: blockedAt, loop: !blocked };
}
function pathLength(pts, closed) { var L = 0; for (var i = 0; i < pts.length - 1; i++) L += Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); if (closed && pts.length > 1) L += Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]); return L; }

function zoneCenterCell(z, kind, grid) {
  var Z = ZONES[z], cx = (Z.x0 + Z.x1) / 2 | 0, cy = (Z.y0 + Z.y1) / 2 | 0, best = null, bd = 1e9;
  for (var y = Z.y0; y <= Z.y1; y++) for (var x = Z.x0; x <= Z.x1; x++) {
    var v = grid[idx(x, y)]; if (v === T.BUILD || v === T.WATER) continue;
    if (kind === 'ground' && v !== T.ROAD) continue;
    var d = Math.hypot(x - cx, y - cy) - (kind === 'mast' && v === T.RIDGE ? 6 : 0); if (d < bd) { bd = d; best = [x, y]; } }
  return best;
}
function defaultPath(kind, z) {
  var Z = ZONES[z];
  if (kind === 'drone') return [[Z.x0 + 3, Z.y0 + 3], [Z.x1 - 3, Z.y0 + 3], [Z.x1 - 3, Z.y1 - 3], [Z.x0 + 3, Z.y1 - 3]];
  if (kind === 'mast') return [zoneCenterCell(z, 'mast', WORLD.brief)];
  var road = [];
  for (var y = Z.y0; y <= Z.y1; y++) for (var x = Z.x0; x <= Z.x1; x++) if (WORLD.brief[idx(x, y)] === T.ROAD) road.push([x, y]);
  var c = [road.reduce(function (a, b) { return b[0] < a[0] ? b : a; }), road.reduce(function (a, b) { return b[0] > a[0] ? b : a; }),

    (U.phase === 'setup' ? KINDS.map(function (k) { return '<span><i style="background:' + ACOL[k] + '"></i>' + C.ASSETS[k].name + '</span>'; }).join('') : '') + '</div>';
  $('mapBar').innerHTML = (modes.length ? '<div class="tabs">' + modes.map(function (m) { return '<button class="tab' + (U.mapMode === m[0] ? ' on' : '') + '" data-map="' + m[0] + '">' + m[1] + '</button>'; }).join('') + '</div>' : '') + leg;
}
function render() { renderHeader(); renderSide(); draw(); }

/* ---------- interactions ---------- */
function cellFromEvent(e) { var r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * W), Math.floor((e.clientY - r.top) / r.height * H)]; }
function inZone(k, x, y) { return C.zoneOf(x, y) === U.cfg.command.zones[k]; }
function placePoint(k, x, y, quiet) {
  var zname = C.ZONES[U.cfg.command.zones[k]].name;
  function no(t) { if (!quiet) msg(t, true); return null; }
  if (!C.inb(x, y)) return null;
  if (k === 'mast') { var v = C.WORLD.brief[C.idx(x, y)]; if (v === T.BUILD || v === T.WATER) return no('The mast cannot stand on a building or water.'); return [x, y]; }
  if (k === 'ground') {
    var best = null, bd = 1e9; for (var yy = 0; yy < H; yy++) for (var xx = 0; xx < W; xx++) if (C.WORLD.brief[C.idx(xx, yy)] === T.ROAD) { var d = Math.hypot(xx - x, yy - y); if (d < bd) { bd = d; best = [xx, yy]; } }
    if (!best || bd > 8) return no('The ground robot can only drive on roads. Click nearer a road.');
    return best;
  }
  return [x, y];
}
var drag = null;
function setupAsset() { return ['drone', 'ground', 'mast'].indexOf(U.sideTab) >= 0 ? U.sideTab : null; }
cv.addEventListener('pointerdown', function (e) {
  if (U.phase !== 'setup') return;
  var k = setupAsset(); if (!k || k === 'mast') return;
  var c = cellFromEvent(e), p = U.cfg[k].path || [];
  for (var i = p.length - 1; i >= 0; i--) if (Math.hypot(p[i][0] - c[0], p[i][1] - c[1]) <= 1.6) { drag = { k: k, i: i, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } e.preventDefault(); return; }
});
cv.addEventListener('pointermove', function (e) {
  if (!drag) return; var c = cellFromEvent(e), pt = placePoint(drag.k, c[0], c[1], true), cur = U.cfg[drag.k].path[drag.i];
  if (pt && (pt[0] !== cur[0] || pt[1] !== cur[1])) { U.cfg[drag.k].path[drag.i] = pt; drag.moved = true; U.cfg[drag.k].route = 'custom'; draw(); }
});
cv.addEventListener('pointerup', function (e) {
  var c = cellFromEvent(e);
  if (drag) { var d = drag; drag = null; if (!d.moved) U.cfg[d.k].path.splice(d.i, 1); U.cfg[d.k].route = 'custom'; save(); render(); return; }
  if (U.phase === 'gap' && U.gapTab === 'map') { if (C.inb(c[0], c[1])) { U.corrections.push({ x: c[0], y: c[1], type: U.corrType }); save(); render(); } return; }
  if (U.phase !== 'setup') return;
  var k = setupAsset(); if (!k) { msg('Choose the Drone, Ground robot or Mast tab first, then click the map.'); return; }
  var pt = placePoint(k, c[0], c[1]); if (!pt) return;
  if (k === 'mast') U.cfg.mast.pos = pt; else U.cfg[k].path = (U.cfg[k].path || []).concat([pt]);
  U.cfg[k].route = 'custom'; save(); render();
});
cv.addEventListener('contextmenu', function (e) { if (U.phase === 'setup' && U.cfg[U.sideTab] && U.cfg[U.sideTab].path) { e.preventDefault(); U.cfg[U.sideTab].path.pop(); save(); render(); } });
document.addEventListener('change', function (e) {
  var t = e.target, k = t.getAttribute('data-k'), f = t.getAttribute('data-f');
  if (t.id === 'groupName') { U.group = t.value.trim() || 'Group'; save(); return; }
  if (t.id === 'corrType') { U.corrType = t.value; return; }
  if (t.id === 'pvLook') { U.pvLook = t.value; drawPreviews(); return; }
  if (t.id === 'pvWx') { U.pvWx = t.value; drawPreviews(); return; }
  if (!k) return;
  if (k === 'zone') { U.cfg.command.zones[f] = +t.value; var a = U.cfg[f]; a.route = f === 'drone' ? 'loop' : f === 'ground' ? 'long' : 'centre'; if (f === 'mast') a.pos = C.routeTemplate('mast', +t.value, 'centre')[0]; else a.path = C.routeTemplate(f, +t.value, a.route); }
  else if (f === 'route') { var b = U.cfg[k]; b.route = t.value; if (t.value !== 'custom') { var rt = C.routeTemplate(k, U.cfg.command.zones[k], t.value); if (k === 'mast') b.pos = rt[0]; else b.path = rt; } }
  else if (k === 'command' || k === 'operator') { var v = t.value; U.cfg[k][f] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; }
  else if (f === 'preset') { if (t.value !== 'custom') C.applyPreset(U.cfg, k, t.value); else U.cfg[k].preset = 'custom'; }
  else { U.cfg[k][f] = t.value || null; U.cfg[k].preset = 'custom'; }
  save(); render();
});
document.addEventListener('input', function (e) {
  var t = e.target, key = t.getAttribute('data-text'), w = t.getAttribute('data-work');
  if (key) { if (key === 'op') U.texts.op = t.value; else if (key === 'aar') U.texts.aar = t.value; else U.texts.dir[key.split('.')[1]] = t.value; save(); }
  if (w != null) { U.workload[+w] = +t.value; t.nextElementSibling.textContent = t.value; save(); }
});
function doDecide(t) { if (C.decide(U.sim, +t.getAttribute('data-id'), t.getAttribute('data-dec'))) { U.hover = null; lastQ = ''; updateMission(); draw(); } }
document.addEventListener('pointerdown', function (e) { if (U.phase !== 'mission' || !e.target.closest) return; var t = e.target.closest('[data-dec]'); if (t) { e.preventDefault(); doDecide(t); return; } var c = e.target.closest('[data-hover]'); if (c) { U.hover = +c.getAttribute('data-hover'); draw(); drawMissionView(); } });
document.addEventListener('mouseover', function (e) { var r = e.target.closest && e.target.closest('[data-hover]'); if (!r) return; var id = +r.getAttribute('data-hover'); if (id !== U.hover) { U.hover = id; draw(); drawMissionView(); } });
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
  if (t.hasAttribute('data-tab')) { U.sideTab = t.getAttribute('data-tab'); if (KINDS.indexOf(U.sideTab) >= 0) U.sel = U.sideTab; render(); return; }
  if (t.hasAttribute('data-gtab')) { U.gapTab = t.getAttribute('data-gtab'); if (U.gapTab === 'map') U.mapMode = 'briefing'; render(); return; }
  if (t.hasAttribute('data-map')) { U.mapMode = t.getAttribute('data-map'); render(); return; }
  if (t.hasAttribute('data-dec')) { if (e.detail === 0) doDecide(t); return; }
  if (t.hasAttribute('data-speed')) { U.speed = +t.getAttribute('data-speed'); updateMission(); return; }
  var act = t.getAttribute('data-act'), k = t.getAttribute('data-k');
  if (act === 'undo') { (U.cfg[k].path || []).pop(); U.cfg[k].route = 'custom'; save(); render(); }
  if (act === 'clear') { U.cfg[k].path = []; U.cfg[k].route = 'custom'; save(); render(); }
  if (act === 'delCorr') { U.corrections.splice(+t.getAttribute('data-i'), 1); save(); render(); }
  if (act === 'printRecord') printHTML('<h2>Mission record · ' + esc(U.group) + ' · round ' + U.round + '</h2>' + recordTable(U.sim));
  if (act === 'printDir') printHTML('<h2>Command directions · ' + esc(U.group) + ' · round ' + U.round + '</h2>' + KINDS.map(function (k) { return '<h3>' + C.ASSETS[k].name + '</h3><p>' + esc(U.texts.dir[k]).replace(/\n/g, '<br>') + '</p>'; }).join(''));
  if (act === 'csv') download('mission-record-' + slug() + '.csv', 'text/csv', [['Arrived', 'Robot', 'Sensor', 'Saw', 'Square', 'Confidence', 'Decision']].concat(recordRows(U.sim)).map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n'));
  if (act === 'copyCode') { var box = $('codeBox'); box.select(); try { navigator.clipboard.writeText(box.value).then(function () { msg('Code copied.'); }, function () { document.execCommand('copy'); msg('Code copied.'); }); } catch (er) { document.execCommand('copy'); msg('Code copied.'); } }
  if (act === 'review') dialog('<h2>Every report, with the truth</h2><div class="note">Look at what the real ones had in common: the description, other sensors agreeing, the place.</div>' + recordTable(U.sim, true));
  if (act === 'pack') download('unit-pack-' + slug() + '.html', 'text/html', unitPack());
  if (act === 'next') { U.round = Math.min(3, U.round + 1); U.phase = 'setup'; U.sim = null; U.mapMode = 'briefing'; U.texts.op = ''; save(); render(); }
});
function slug() { return (U.group + '-r' + U.round).replace(/[^a-z0-9-]+/gi, '_'); }
function download(name, type, text) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function printHTML(html) { $('printArea').innerHTML = html; window.print(); }
function cfgSummary(cfg) {
  return KINDS.map(function (k) { var a = cfg[k]; return '<li><b>' + C.ASSETS[k].name + '</b>: zone ' + C.ZONES[cfg.command.zones[k]].name + ', ' + C.SENSORS[a.primary].name + (a.fallback ? ' then ' + C.SENSORS[a.fallback].name : '') + (k !== 'mast' ? ', speed ' + a.speed + ', on detection ' + a.onDet + (k === 'drone' ? ', altitude ' + a.alt : '') + ', if position lost: ' + (a.lostRule || 'carry') : ', at ' + C.square(a.pos[0], a.pos[1])) + '</li>'; }).join('') +
    '<li><b>Command</b>: report above ' + cfg.command.threshold + '%, interval ' + (cfg.command.interval || 'immediate') + ', budget ' + cfg.command.budget + '/min per asset, revisits ' + (cfg.command.revisit ? 'allowed' : 'not allowed') + '</li>' +
    '<li><b>Operator</b>: ' + cfg.operator.order + ' first, hide below ' + cfg.operator.filter + '%, expiry ' + cfg.operator.expiry + ' s</li>';
}
function unitPack() {
  var S = U.sim, sc = C.score(S);
  return '<!doctype html><meta charset="utf-8"><title>Unit pack ' + esc(U.group) + ' round ' + U.round + '</title><style>body{font:14px Arial;max-width:900px;margin:20px auto;padding:0 16px}h1,h2{color:#45004D}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:3px 6px;text-align:left}</style>' +
    '<h1>Unit pack · ' + esc(U.group) + ' · round ' + U.round + '</h1><p>Seed ' + S.spec.seed + ' · weather at start: ' + esc(C.WEATHER[S.spec.weather].label) + ' · mission ' + S.spec.length + ' s</p>' +
    '<h2>Configuration and rules</h2><ul>' + cfgSummary(S.cfg) + '</ul>' +
    '<h2>Scorecard</h2><p>Total <b>' + sc.total + '</b>: ' + sc.found + '/6 real contacts confirmed, ' + sc.falseConf + ' false confirmations, ' + sc.expired + ' expired, ' + sc.area + '% area kept under watch, first confirmation ' + (sc.tFirst == null ? 'none' : mmss(sc.tFirst)) + ', ' + sc.dropped + ' reports dropped.</p>' +
    '<h2>Operator workload</h2><p>Mean decision time ' + sc.workload.meanDecision + ' s, longest queue ' + sc.workload.maxQueue + ', self-rating ' + U.workload.join(' / ') + ' (think / rushed / frustrated).</p>' +
    '<h2>Operator report</h2><p>' + esc(U.texts.op).replace(/\n/g, '<br>') + '</p><h2>Command directions</h2>' + KINDS.map(function (k) { return '<p><b>' + C.ASSETS[k].name + ':</b> ' + esc(U.texts.dir[k]).replace(/\n/g, '<br>') + '</p>'; }).join('') +
    '<h2>Briefing map corrections</h2><ul>' + U.corrections.map(function (m) { return '<li>' + C.square(m.x, m.y) + ': ' + esc(m.type) + '</li>'; }).join('') + '</ul>' +
    '<h2>Mission log</h2><ul>' + S.events.map(function (e) { return '<li>' + mmss(e.t) + ' ' + esc(e.text) + '</li>'; }).join('') + '</ul><h2>Mission record (with the truth)</h2>' + recordTable(S, true) +
    '<h2>After-action review</h2><p><i>What we set · What happened · Why · What we would change for a real unit.</i></p>';
}

/* ---------- phase buttons ---------- */
document.addEventListener('click', function (e) {
  var id = e.target && e.target.id;
  if (id === 'btnFreeze') { var errs = C.validate(U.cfg); if (errs.length) { msg(errs[0], true); return; } U.sim = C.createSim(U.cfg, spec()); U.phase = 'mission'; U.running = false; U.mapMode = 'briefing'; save(); render(); }
  if (id === 'btnRun') { U.running = !U.running; last = performance.now(); updateMission(); }
  if (id === 'btnToGap') { U.phase = 'gap'; U.gapTab = 'record'; U.running = false; render(); }
  if (id === 'btnDebrief') { U.phase = 'debrief'; U.mapMode = 'truth'; var sc = C.score(U.sim); U.results.push({ g: U.group, r: U.round, total: sc.total }); save(); render(); }
  if (id === 'btnBig') { U.big = !U.big; save(); render(); }
  if (id === 'btnHelp') showHelp();
  if (id === 'btnBoard') showBoard();
  if (id === 'btnFac') showFac();
});

/* ---------- main loop ---------- */
var last = performance.now(), sideTimer = 0;
function tick() {
  var now = performance.now(), dt = Math.min(0.5, (now - last) / 1000); last = now;
  if (U.phase === 'mission' && U.running && U.sim && !U.sim.done) {
    var simDt = dt * U.speed; while (simDt > 1e-6) { var s = Math.min(0.25, simDt); C.step(U.sim, s); simDt -= s; }
    sideTimer += dt; if (sideTimer > 0.2 || U.sim.done) { sideTimer = 0; updateMission(); }
    if (U.sim.done) { U.running = false; msg('Mission over. Go to the gap.'); updateMission(); }
  }
}
setInterval(tick, 50);
function loop() { if (U.phase === 'mission') draw(); requestAnimationFrame(loop); }

/* ---------- dialogs ---------- */
function dialog(html) { var o = document.createElement('div'); o.className = 'overlay'; o.innerHTML = '<div class="dialog">' + html + '<div style="text-align:right;margin-top:12px"><button class="primary" data-close>Close</button></div></div>'; o.addEventListener('click', function (e) { if (e.target === o || e.target.hasAttribute('data-close')) o.remove(); }); document.body.appendChild(o); return o; }
function showHelp() {
  dialog('<h2>How it works</h2><p>Your group is one hybrid patrol unit: a drone, a ground robot and a sensor mast (the machines), plus an operator station and a command element (the people). All groups play the same world with the same events at the same times.</p>' +
    '<h3>Each round</h3><ol><li><b>Setup.</b> Asset leads choose sensors, motion and patrol path. The commander allocates zones and sets the reporting rules. The operators choose how their queue works. Then everything freezes.</li>' +
    '<li><b>Mission.</b> The operators confirm or reject each report as it arrives. Nobody else touches the laptop. Disruptions appear only in the mission log.</li>' +
    '</ol><h3>Operators: four checks before you confirm</h3><ol class="checks"><li><b>What did it see?</b> Does the description fit a real target?</li><li><b>Does another sensor agree?</b> Two different sensors near the same place is much stronger evidence.</li><li><b>Does it make sense there?</b> A vehicle in the marsh or a hot spot on a roof is suspicious.</li><li><b>Can this sensor be trusted right now?</b> Camera at night, thermal at midday, acoustic in rain: weak.</li></ol><div class="note">Confidence is the robot\'s own guess: use it to sort, not to decide. Confirming a false contact costs 20 points, letting a report expire costs 4, rejecting costs nothing, but a real contact nobody confirms earns nothing.</div><ol start="3">' +
    '<li><b>Gap.</b> Operators write one report for the commander from the mission record. The commander writes one direction per asset. Everyone corrects the briefing map.</li>' +
    '<li><b>Debrief.</b> The truth is revealed, with the score and the result code for the leaderboard.</li></ol>' +
    '<h3>Limits</h3><p>Assets can go anywhere on the map. Their limits are battery time (they fly or drive back to base to recharge), sensor range and flight height.</p><h3>Sensor view</h3><p>During setup and the mission you can see what each sensor actually returns: a camera picture, a heat image, lidar points, a radar echo or a sound trace. This is all the robot gets. People decide what it means.</p><h3>Scoring</h3><p>+30 per real contact confirmed · −20 per false or misplaced confirmation · −4 per expired report · +1 per % of the area kept under watch (seen in the last minute, averaged over the mission) · up to +30 for a fast first confirmation · −1 per report dropped by the comms budget.</p>' +
    '<p class="note">Everything runs in this one file. No internet is needed. Settings are kept in this browser until you reset them.</p>');
}
function showBoard() {
  var o = dialog('<h2>Leaderboard</h2><p class="note">Paste the result codes from every group, one per line.</p><textarea id="codes" rows="8" placeholder="PU1.…"></textarea><div style="margin:6px 0"><button class="primary" id="btnRank">Rank</button></div><div id="board"></div>');
  o.querySelector('#btnRank').onclick = function () {
    var rows = [], bad = 0;
    o.querySelector('#codes').value.split(/\s+/).filter(Boolean).forEach(function (c) { try { var p = c.split('.'); var j = decodeURIComponent(escape(atob(p[1]))); if (String(C.hashStr(j) % 10000) !== p[2]) throw 0; rows.push(JSON.parse(j)); } catch (e) { bad++; } });
    var byRound = {}; rows.forEach(function (r) { (byRound[r.r] = byRound[r.r] || []).push(r); });
    o.querySelector('#board').innerHTML = (bad ? '<p class="warn">' + bad + ' code(s) could not be read.</p>' : '') + Object.keys(byRound).sort().map(function (k) { return '<h3>Round ' + k + '</h3><table><tr><th>#</th><th>Group</th><th>Total</th><th>Found</th><th>False</th><th>Expired</th><th>Area</th><th>Dropped</th></tr>' + byRound[k].sort(function (a, b) { return b.t - a.t; }).map(function (r, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(r.g) + '</td><td><b>' + r.t + '</b></td><td>' + r.f + '</td><td>' + r.fc + '</td><td>' + r.e + '</td><td>' + r.a + '%</td><td>' + r.d + '</td></tr>'; }).join('') + '</table>'; }).join('');
  };
}
function showFac() {
  var o = dialog('<h2>Facilitator settings</h2><p class="note">Keep the defaults so every group plays the same world. Change them only for practice runs.</p>' +
    '<label class="row">Seed (blank = round default) <input id="fSeed" type="number" value="' + esc(U.ov.seed) + '"></label>' +
    '<label class="row">Mission length <select id="fLen">' + opt([[240, '4 min'], [360, '6 min'], [480, '8 min']], U.ov.length) + '</select></label>' +
    '<label class="row">Weather (blank = round default) <select id="fWx"><option value="">round default</option>' + opt(Object.keys(C.WEATHER).map(function (w) { return [w, C.WEATHER[w].label]; }), U.ov.weather) + '</select></label>' +
    '<p><button id="fSave" class="primary">Apply</button> <button id="fReset">Reset everything on this laptop</button></p><p class="note">Round defaults: 1 clear day, no disruptions · 2 night with comms break, drone sensor fault, ground robot loses positioning · 3 heavy rain turning to dust, comms break, drone lost, mast sensor fault.</p>');
  o.querySelector('#fSave').onclick = function () { U.ov = { seed: o.querySelector('#fSeed').value, length: +o.querySelector('#fLen').value, weather: o.querySelector('#fWx').value }; save(); o.remove(); render(); msg('Settings applied.'); };
  o.querySelector('#fReset').onclick = function () { if (o.querySelector('#fReset').dataset.armed) { try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ } location.reload(); } else { o.querySelector('#fReset').dataset.armed = '1'; o.querySelector('#fReset').textContent = 'Click again to confirm reset'; } };
}

window.addEventListener('error', function (e) { var d = document.body.getAttribute('data-errors') || ''; document.body.setAttribute('data-errors', d + '|' + e.message); });
load(); if (U.phase !== 'setup') U.phase = 'setup';
render(); requestAnimationFrame(loop);
window.__U = U; window.__render = render;
})();
</script>
</body>
</html>
