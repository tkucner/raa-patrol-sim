<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patrol Unit Simulator</title>
<style>
:root{--plum:#45004D;--mag:#B1059D;--peach:#FFDBC4;--amber:#D99216;--pink:#D881CE;--light:#F6ECF5;--ink:#1A1A1A;--muted:#666;--ok:#1B6E20;--bad:#B3261E;--line:#ddd;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Arial,Helvetica,sans-serif}
body.big{font-size:19px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 14px;background:var(--plum);color:#fff}
header h1{font-size:1.15em;margin:0 12px 0 0;white-space:nowrap}
header input{width:9em;padding:4px 6px;border-radius:4px;border:0;font:inherit}
.phases{display:flex;gap:4px;flex-wrap:wrap}
.phase{padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:.9em}
.phase.on{background:var(--mag);font-weight:bold}
.spacer{flex:1}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--plum);background:#fff;color:var(--plum);padding:6px 12px}
button.primary{background:var(--mag);border-color:var(--mag);color:#fff;font-weight:bold}
button.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button{min-height:38px}
.seg{display:inline-flex;border:1px solid var(--plum);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;min-width:52px}
.seg button.on{background:var(--plum);color:#fff}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl .big{padding:10px 18px;font-size:1.05em}
.ev{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:.82em;padding:1px 7px;border-radius:9px;background:#eee}
.chip.good{background:#DDEFD9}.chip.bad{background:#F6D5D2}.chip.mid{background:#FFE8D6}
.saw{font-style:italic}
.checks{margin:4px 0 0 18px;padding:0}.checks li{margin:2px 0}
main{display:flex;gap:12px;padding:12px;align-items:flex-start}
#mapWrap{flex:1 1 auto;min-width:0}
#map{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block;touch-action:none}
#side{flex:0 0 440px;max-width:440px}
body.big #side{flex-basis:520px;max-width:520px}
.card{background:var(--light);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 6px;color:var(--plum);font-size:1.05em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{padding:5px 10px;border-radius:6px;border:1px solid var(--plum);background:#fff;color:var(--plum)}
.tab.on{background:var(--plum);color:#fff}
label.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
select,textarea,input[type=number]{font:inherit;padding:4px 6px;border:1px solid #bbb;border-radius:4px;background:#fff}
textarea{width:100%;min-height:90px}
.bar{height:10px;background:#e6e6e6;border-radius:5px;overflow:hidden;margin:3px 0 6px}
.bar>i{display:block;height:100%;background:var(--mag)}
.bar.red>i{background:var(--bad)}
.warn{color:var(--bad);font-weight:bold}
.note{color:var(--muted);font-size:.9em}
.msg{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:90vw}
.msg.err{background:var(--bad)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;font-size:.92em}
th{background:var(--plum);color:#fff}
.rep{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:8px;border:2px solid transparent}
.rep.low{background:#FFF3EA}
.rep:hover{border-color:var(--mag)}
.rep .top{display:flex;justify-content:space-between;font-weight:bold;color:var(--plum)}
.rep .btns{display:flex;gap:8px;margin-top:6px}
.rep .btns button{flex:1;padding:10px;min-height:52px;font-size:1.1em;font-weight:bold;touch-action:manipulation}
.confirm{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.reject{background:#fff!important;border-color:#777!important;color:#333!important}
#log{max-height:180px;overflow:auto;font-size:.9em;background:#fff;border-radius:6px;padding:6px}
#log div{border-bottom:1px dotted #ddd;padding:2px 0}
.clock{font-size:1.6em;font-weight:bold;color:var(--plum)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:#fff;border-radius:6px;padding:6px;text-align:center}
.kpi b{display:block;font-size:1.4em;color:var(--mag)}
.legend span{display:inline-flex;align-items:center;gap:4px;margin:0 10px 4px 0;font-size:.88em}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #999}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.dialog{background:#fff;border-radius:10px;padding:18px 22px;max-width:760px;width:92vw;max-height:88vh;overflow:auto}
.dialog h2{margin-top:0;color:var(--plum)}
.score td:last-child,.score th:last-child{text-align:right}
.total td{font-weight:bold;font-size:1.1em;border-top:2px solid var(--plum)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--peach);font-size:.85em}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}#printArea table{font-size:11pt}}
@media (max-width:1100px){main{flex-direction:column}#side{max-width:none;flex-basis:auto;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Patrol Unit Simulator</h1>
  <span>Group <input id="groupName" aria-label="Group name"></span>
  <span id="roundLabel"></span>
  <div class="phases" id="phases"></div>
  <div class="spacer"></div>
  <button class="ghost" id="btnBig" title="Larger text for the projector">Large text</button>
  <button class="ghost" id="btnHelp">How it works</button>
  <button class="ghost" id="btnBoard">Leaderboard</button>
  <button class="ghost" id="btnFac">Facilitator</button>
</header>
<main>
  <div id="mapWrap">
    <canvas id="map" width="960" height="640" aria-label="Map"></canvas>
    <div id="mapBar" style="margin-top:6px"></div>
  </div>
  <div id="side"></div>
</main>
<div id="printArea"></div>

<script id="core">
/*@CORE@*/
</script>

<script id="views">
/*@VIEWS@*/
</script>

<script id="ui">
/* ================= USER INTERFACE ================= */
(function () {
'use strict';
var C = window.SimCore, W = C.W, H = C.H, T = C.T, PX = 16;
var KINDS = ['drone', 'ground', 'mast'];
var PHASES = [['setup', 'Setup'], ['mission', 'Mission'], ['gap', 'Gap'], ['debrief', 'Debrief']];
var COL = { open: '#EFEAD8', build: '#6B5B6E', trees: '#7FA36B', ridge: '#C9A27A', road: '#B9B9B9', marsh: '#9CC3B9', water: '#5B8FD1' };
var ACOL = { drone: '#B1059D', ground: '#D99216', mast: '#45004D' };
var STORE = 'patrolsim.v1';

var U = { group: 'Group 1', round: 1, phase: 'setup', cfg: C.defaultConfig(), sim: null, running: false, speed: 1, sel: 'drone', sideTab: 'drone',
  gapTab: 'record', mapMode: 'briefing', corrections: [], corrType: 'demolished', texts: { op: '', dir: { drone: '', ground: '', mast: '' }, aar: '' },
  workload: [3, 3, 3], hover: null, ov: { seed: '', length: 360, weather: '' }, results: [], big: false };

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function mmss(t) { t = Math.max(0, Math.floor(t)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function msg(text, err) { var d = document.createElement('div'); d.className = 'msg' + (err ? ' err' : ''); d.textContent = text; document.body.appendChild(d); setTimeout(function () { d.remove(); }, err ? 4200 : 2600); }
function save() { try { localStorage.setItem(STORE, JSON.stringify({ group: U.group, round: U.round, cfg: U.cfg, corrections: U.corrections, texts: U.texts, workload: U.workload, ov: U.ov, results: U.results, big: U.big })); } catch (e) { /* storage unavailable */ } }
function load() { try { var s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s) { ['group', 'round', 'cfg', 'corrections', 'texts', 'workload', 'ov', 'results', 'big'].forEach(function (k) { if (s[k] != null) U[k] = s[k]; }); } } catch (e) { /* ignore */ } }
function spec() { return C.roundSpec(U.round, U.ov); }
function locked() { return U.round === 1; }

/* ---------- map drawing ---------- */
var cv = $('map'), ctx = cv.getContext('2d'), terrainCache = {};
function terrainImage(grid, key) {
  if (terrainCache[key]) return terrainCache[key];
  var c = document.createElement('canvas'); c.width = W * PX; c.height = H * PX; var g = c.getContext('2d');
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
    var v = grid[C.idx(x, y)]; g.fillStyle = v === T.BUILD ? COL.build : v === T.TREES ? COL.trees : v === T.RIDGE ? COL.ridge : v === T.ROAD ? COL.road : v === T.MARSH ? COL.marsh : v === T.WATER ? COL.water : COL.open;
    g.fillRect(x * PX, y * PX, PX, PX);
  }
  g.font = 'bold 13px Arial'; g.fillStyle = 'rgba(30,30,30,.75)';
  [['Built-up block', 37, 9.3], ['Tree line', 17.2, 7], ['Ridge', 46, 23.8], ['Marsh', 49, 34], ['Road', 6, 19.4], ['Farm', 3.6, 38.3]].forEach(function (l) { g.fillText(l[0], l[1] * PX, l[2] * PX); });
  terrainCache[key] = c; return c;
}
function drawGrid() {
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
  for (var x = 0; x <= W; x += 10) { ctx.beginPath(); ctx.moveTo(x * PX, 0); ctx.lineTo(x * PX, H * PX); ctx.stroke(); }
  for (var y = 0; y <= H; y += 10) { ctx.beginPath(); ctx.moveTo(0, y * PX); ctx.lineTo(W * PX, y * PX); ctx.stroke(); }
  ctx.font = 'bold 12px Arial'; ctx.fillStyle = 'rgba(0,0,0,.55)';
  for (var i = 0; i < 6; i++) for (var j = 0; j < 4; j++) ctx.fillText('ABCDEF'.charAt(i) + (j + 1), i * 10 * PX + 4, j * 10 * PX + 14);
  ctx.strokeStyle = 'rgba(69,0,77,.85)'; ctx.lineWidth = 3; ctx.setLineDash([10, 6]);
  ctx.beginPath(); ctx.moveTo(30 * PX, 0); ctx.lineTo(30 * PX, H * PX); ctx.moveTo(0, 20 * PX); ctx.lineTo(W * PX, 20 * PX); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = 'bold 20px Arial'; ctx.fillStyle = 'rgba(69,0,77,.85)';
  C.ZONES.forEach(function (z) { ctx.fillText(z.name, (z.x1 - 3.5) * PX, (z.y1 - 0.6) * PX); });
}
function drawUnitMap() {
  var S = U.sim; ctx.fillStyle = '#9a9a9a'; ctx.fillRect(0, 0, W * PX, H * PX);
  if (!S) return;
  for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) { var i = C.idx(x, y); if (!S.observed[i]) continue; ctx.fillStyle = S.returned[i] ? '#2b2b2b' : '#f4f4f4'; ctx.fillRect(x * PX, y * PX, PX, PX); }
}
function dot(x, y, r, fill, stroke) { ctx.beginPath(); ctx.arc(x * PX, y * PX, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } }
function drawBase() { var b = C.BASE; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#45004D'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b[0] * PX, b[1] * PX, 13, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#45004D'; ctx.font = 'bold 14px Arial'; ctx.fillText('B', b[0] * PX - 5, b[1] * PX + 5); ctx.font = 'bold 11px Arial'; ctx.fillText('Base (recharge)', b[0] * PX - 44, b[1] * PX + 28); }
function drawPaths() {
  KINDS.forEach(function (k) {
    var a = U.cfg[k]; ctx.strokeStyle = ACOL[k]; ctx.fillStyle = ACOL[k]; ctx.lineWidth = k === U.sel && U.phase === 'setup' ? 4 : 2.5;
    if (k === 'mast') { if (a.pos) { ctx.fillRect((a.pos[0]) * PX - 2, (a.pos[1]) * PX - 2, PX + 4, PX + 4); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.fillText('M', a.pos[0] * PX + 3, a.pos[1] * PX + 12); } return; }
    var p = a.path || []; if (!p.length) return;
    var pts = k === 'ground' ? (C.groundRoute(C.WORLD.brief, p).cells) : p.concat([p[0]]);
    ctx.beginPath(); pts.forEach(function (q, i) { var X = (q[0] + 0.5) * PX, Y = (q[1] + 0.5) * PX; if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }); ctx.stroke();
    p.forEach(function (q, i) { dot(q[0] + 0.5, q[1] + 0.5, 7, ACOL[k], '#fff'); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Arial'; ctx.fillText(String(i + 1), (q[0] + 0.5) * PX - 3, (q[1] + 0.5) * PX + 4); });
  });
}
function drawAssets(truth) {
  var S = U.sim; if (!S) return;
  KINDS.forEach(function (k) {
    var st = S.assets[k], x = truth ? st.x : st.x + st.off[0], y = truth ? st.y : st.y + st.off[1];
    var gone = !st.alive || !!st.charging;
    ctx.save(); ctx.globalAlpha = gone ? 0.35 : 1;
    if (k === 'mast') { ctx.fillStyle = ACOL[k]; ctx.fillRect(x * PX - 9, y * PX - 9, 18, 18); }
    else if (k === 'drone') { ctx.beginPath(); ctx.moveTo(x * PX, y * PX - 11); ctx.lineTo(x * PX + 10, y * PX + 8); ctx.lineTo(x * PX - 10, y * PX + 8); ctx.closePath(); ctx.fillStyle = ACOL[k]; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    else dot(x, y, 9, ACOL[k], '#fff');
    ctx.fillStyle = '#000'; ctx.font = 'bold 12px Arial'; ctx.fillText(C.ASSETS[k].name + (!st.alive ? ' (out)' : st.charging ? ' (charging)' : st.goingHome ? ' (to base)' : st.gpsLost && !truth ? ' (position?)' : ''), x * PX + 12, y * PX - 8);
    ctx.restore();
  });
}
function drawPicture() {
  var S = U.sim; if (!S) return;
  S.reports.forEach(function (r) {
    if (r.status === 'confirmed') { if (U.phase === 'debrief' && U.mapMode === 'truth') { dot(r.x, r.y, 4, 'rgba(27,110,32,.8)'); return; } dot(r.x, r.y, 8, 'rgba(27,110,32,.9)', '#fff'); ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial'; ctx.fillText('✓', r.x * PX - 4, r.y * PX + 4); }
    else if (r.status === 'open') dot(r.x, r.y, 5, 'rgba(177,5,157,.55)');
  });
  if (U.hover != null) { var h = S.reports.filter(function (r) { return r.id === U.hover; })[0]; if (h) { ctx.strokeStyle = '#B1059D'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x * PX, h.y * PX, 18, 0, Math.PI * 2); ctx.stroke(); } }
}
function drawTruth() {
  var S = U.sim, t = S ? S.t : 0;
  C.WORLD.errors.forEach(function (e) { ctx.strokeStyle = '#B3261E'; ctx.lineWidth = 3; ctx.setLineDash([6, 4]); ctx.strokeRect(e.x * PX - 4, e.y * PX - 4, e.w * PX + 8, e.h * PX + 8); ctx.setLineDash([]); ctx.fillStyle = '#B3261E'; ctx.font = 'bold 12px Arial'; ctx.fillText(e.label, e.x * PX, (e.y + e.h) * PX + 16); });
  var sc = S ? C.score(S) : null;
  C.CONTACTS.forEach(function (c) {
    var p = C.contactPos(c, t), found = sc && sc.foundIds.indexOf(c.id) >= 0;
    if (c.real) { dot(p.x, p.y, 10, found ? '#1B6E20' : '#B3261E', '#fff'); } else { ctx.fillStyle = '#D99216'; ctx.fillRect(p.x * PX - 8, p.y * PX - 8, 16, 16); }
    var lab = c.label + (c.real ? (found ? ' — found' : ' — missed') : ''); ctx.font = 'bold 12px Arial'; var lw = ctx.measureText(lab).width, lx = p.x * PX + 12 + lw > W * PX - 4 ? p.x * PX - 12 - lw : p.x * PX + 12;
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(lx - 2, p.y * PX - 9, lw + 4, 17); ctx.fillStyle = '#000'; ctx.fillText(lab, lx, p.y * PX + 4);
  });
}
function drawCorrections() {
  U.corrections.forEach(function (m, i) {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#B3261E'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc((m.x + 0.5) * PX, (m.y + 0.5) * PX, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#B3261E'; ctx.font = 'bold 13px Arial'; ctx.fillText(String(i + 1), (m.x + 0.5) * PX - 4, (m.y + 0.5) * PX + 5);
  });
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  var mode = U.mapMode;
  if (mode === 'unit') drawUnitMap(); else ctx.drawImage(terrainImage(mode === 'truth' ? C.WORLD.truth : C.WORLD.brief, mode === 'truth' ? 't' : 'b'), 0, 0);
  if (U.phase === 'mission' && mode === 'briefing' && U.sim) { ctx.fillStyle = 'rgba(255,255,255,.35)'; for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if (U.sim.observed[C.idx(x, y)]) ctx.fillRect(x * PX, y * PX, PX, PX); }
  drawGrid(); drawBase();
  if (U.phase === 'setup') drawPaths();
  if (U.phase === 'gap' || U.phase === 'debrief') drawCorrections();
  if (U.phase === 'mission' || U.phase === 'gap') { drawPicture(); drawAssets(false); }
  if (U.phase === 'debrief') { if (mode === 'truth') drawTruth(); drawPicture(); drawAssets(mode === 'truth'); }
}

/* ---------- sensor view (shared views.js) ---------- */
var V = window.SimViews, CAPTION = V.CAPTION, PREVIEW_T = V.PREVIEW_T;
function sensorView(cvs, o) { V.sensorView(cvs, o); }
function drawPreviews() {
  ['pv1', 'pv2'].forEach(function (id) { var c = $(id); if (!c) return; var s = c.getAttribute('data-sensor'), plat = c.getAttribute('data-platform');
    sensorView(c, { sensor: s, weather: U.pvWx || 'clear', look: U.pvLook || 'person', conf: V.previewConf(s, U.pvLook || 'person', U.pvWx || 'clear'), seed: 11, moving: U.pvLook === 'vehicle' || U.pvLook === 'animal', platform: plat, alt: U.cfg.drone.alt }); });
}
function drawMissionView() {
  var cv2 = $('sv'); if (!cv2 || !U.sim) return; var S = U.sim, q = C.queue(S), r = null;
  if (U.hover != null) r = S.reports.filter(function (x) { return x.id === U.hover; })[0];
  if (!r) r = q[0];
  var key = r ? r.id + '|' + r.status : 'none'; if (key === lastView) return; lastView = key;
  if (!r) { var g = cv2.getContext('2d'); g.fillStyle = '#1a1a1a'; g.fillRect(0, 0, cv2.width, cv2.height); g.fillStyle = '#aaa'; g.font = '16px Arial'; g.fillText('No report selected', 20, cv2.height / 2); $('svCap').textContent = ''; return; }
  sensorView(cv2, { sensor: r.sensor, weather: r.wx || S.weather, look: r.look, conf: r.conf, seed: r.id * 977, moving: r.moving, platform: r.asset, alt: r.alt });
  $('svCap').textContent = 'Report ' + r.id + ' from the ' + C.ASSETS[r.asset].name.toLowerCase() + '. ' + V.caption(r.sensor, r.asset, r.alt);
}
var lastView = '';

/* ---------- header ---------- */
function renderHeader() {
  $('groupName').value = U.group;
  $('roundLabel').innerHTML = 'Round <select id="roundSel">' + [1, 2, 3].map(function (r) { return '<option' + (r === U.round ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select> · ' + esc(C.WEATHER[spec().weather].label);
  $('phases').innerHTML = PHASES.map(function (p) { return '<span class="phase' + (p[0] === U.phase ? ' on' : '') + '">' + p[1] + '</span>'; }).join('');
  $('roundSel').disabled = U.phase === 'mission';
  $('roundSel').onchange = function (e) { U.round = +e.target.value; U.phase = 'setup'; U.sim = null; U.running = false; save(); render(); };
  document.body.classList.toggle('big', !!U.big);
}

/* ---------- side panels ---------- */
function opt(list, val) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
function sensorOpts(val, none) { return (none ? '<option value="">none</option>' : '') + opt(Object.keys(C.SENSORS).map(function (k) { return [k, C.SENSORS[k].name + ' (weight ' + C.SENSORS[k].cost + ')']; }), val); }
function vendorTable(keys) {
  var ws = Object.keys(C.WEATHER);
  return '<table><tr><th>Sensor</th><th>Vendor score</th>' + ws.map(function (w) { return '<th>' + esc(C.WEATHER[w].label) + '</th>'; }).join('') + '</tr>' +

function tick() {
  var now = performance.now(), dt = Math.min(0.5, (now - last) / 1000); last = now;

    var simDt = dt * U.speed; while (simDt > 1e-6) { var s = Math.min(0.25, simDt); C.step(U.sim, s); simDt -= s; }
    sideTimer += dt; if (sideTimer > 0.2 || U.sim.done) { sideTimer = 0; updateMission(); }

function showHelp() {
  dialog('<h2>How it works</h2><p>Your group is one hybrid patrol unit: a drone, a ground robot and a sensor mast (the machines), plus an operator station and a command element (the people). All groups play the same world with the same events at the same times.</p>' +
    '<h3>Each round</h3><ol><li><b>Setup.</b> Asset leads choose sensors, motion and patrol path. The commander allocates zones and sets the reporting rules. The operators choose how their queue works. Then everything freezes.</li>' +
    '<li><b>Mission.</b> The operators confirm or reject each report as it arrives. Nobody else touches the laptop. Disruptions appear only in the mission log.</li>' +
    '</ol><h3>Operators: four checks before you confirm</h3><ol class="checks"><li><b>What did it see?</b> Does the description fit a real target?</li><li><b>Does another sensor agree?</b> Two different sensors near the same place is much stronger evidence.</li><li><b>Does it make sense there?</b> A vehicle in the marsh or a hot spot on a roof is suspicious.</li><li><b>Can this sensor be trusted right now?</b> Camera at night, thermal at midday, acoustic in rain: weak.</li></ol><div class="note">Confidence is the robot\'s own guess: use it to sort, not to decide. Confirming a false contact costs 20 points, letting a report expire costs 4, rejecting costs nothing, but a real contact nobody confirms earns nothing.</div><ol start="3">' +
    '<li><b>Gap.</b> Operators write one report for the commander from the mission record. The commander writes one direction per asset. Everyone corrects the briefing map.</li>' +
    '<li><b>Debrief.</b> The truth is revealed, with the score and the result code for the leaderboard.</li></ol>' +
    '<h3>Limits</h3><p>Assets can go anywhere on the map. Their limits are battery time (they fly or drive back to base to recharge), sensor range and flight height.</p><h3>Sensor view</h3><p>During setup and the mission you can see what each sensor actually returns: a camera picture, a heat image, lidar points, a radar echo or a sound trace. This is all the robot gets. People decide what it means.</p><h3>Scoring</h3><p>+30 per real contact confirmed · −20 per false or misplaced confirmation · −4 per expired report · +1 per % of the area kept under watch (seen in the last minute, averaged over the mission) · up to +30 for a fast first confirmation · −1 per report dropped by the comms budget.</p>' +
    '<p class="note">Everything runs in this one file. No internet is needed. Settings are kept in this browser until you reset them.</p>');
